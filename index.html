<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>messenger — 选择版本</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --white: #f5f3ef;
      --ink: #1a1a18;
      --accent: #c43e2c;
      --gray-600: #6b6760;
      --gray-300: #a8a49c;
      --font-serif: 'Times New Roman', 'SimSun', 'Noto Serif SC', serif;
      --font-sans: 'Inter', -apple-system, 'PingFang SC', sans-serif;
      --font-mono: 'SF Mono', 'Menlo', monospace;
    }
    body {
      font-family: var(--font-serif);
      background: var(--white);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 60px 40px;
      line-height: 1.7;
    }
    h1 {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 400;
      letter-spacing: 0.04em;
      text-align: center;
    }
    .versions {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .version-card {
      border: 1px solid var(--gray-300);
      padding: 40px 48px;
      max-width: 420px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.3s;
      cursor: pointer;
    }
    .version-card:hover {
      border-color: var(--accent);
    }
    .version-card h2 {
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }
    .version-card h2 span {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gray-600);
      display: block;
      margin-bottom: 8px;
    }
    .version-card ul {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--gray-600);
      line-height: 2;
      list-style: none;
      padding: 0;
    }
    .version-card ul li::before {
      content: '—';
      margin-right: 8px;
      color: var(--gray-300);
    }
    .hint {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--gray-600);
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>选择版本预览</h1>
  <div class="versions">
    <a class="version-card" href="index-alpha.html">
      <h2><span>Alpha</span>messenger</h2>
      <ul>
        <li>定位式副标题</li>
        <li>Pull-quote italic 排版</li>
        <li>Manifesto 拆为四段</li>
        <li>英文翻译完整</li>
      </ul>
    </a>
    <a class="version-card" href="index-beta.html">
      <h2><span>Beta</span>messenger</h2>
      <ul>
        <li>口号式副标题</li>
        <li>大标题式排版</li>
        <li>Manifesto 三段合并</li>
        <li>英文翻译部分缺失</li>
      </ul>
    </a>
  </div>
  <div class="hint">点击卡片预览对应版本</div>
</body>
</html>
