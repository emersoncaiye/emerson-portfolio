                  '<p class="flowback-intro">买下它的时候，决定你想拥有多久。不想继续了？送回来。我们会根据你持有的时间，给你对应的回流金。你可以选换购、选积分、或者直接拿现金。</p>' +
                  '<table class="flowback-table-detail">' +
                    '<thead><tr><th>持有时间</th><th>积分换购</th><th>现金返还</th></tr></thead>' +
                    '<tbody>' +
                      '<tr><td>7 天内</td><td class="highlight">100% 换购</td><td class="highlight">80%</td></tr>' +
                      '<tr><td>30 天内</td><td>80% 积分</td><td>60%</td></tr>' +
                      '<tr><td>90 天内</td><td>60% 积分</td><td>40%</td></tr>' +
                      '<tr><td>3–6 个月</td><td>40% 积分</td><td>20%</td></tr>' +
                      '<tr><td>6–12 个月</td><td>20% 积分</td><td>—</td></tr>' +
                      '<tr><td>1 年以上</td><td colspan="2" style="text-align:center;color:var(--accent);">代售（70% 给你）</td></tr>' +
                    '</tbody>' +
                  '</table>' +
                  '<div class="flowback-notes">' +
                    '<p><strong>关于「趁早放手」：</strong>一件物品陪伴你的时间越久，它身上的故事就越多。我们感谢你的珍惜，但也必须尊重时间在它身上留下的痕迹。如果你觉得它不再适合你，请在它状态还好的时候，让它趁早去遇见下一个人。</p>' +
                    '<p>3个月内：它还很年轻，我们愿意给你一个很好的回报。3-6个月：它有了生活的印记，我们依然感谢你，但它的价值需要重新计算。这是对这件物品的尊重，也是对我们共同相信的「流动」理念的负责。</p>' +
                    '<p><strong>积分说明：</strong>积分在三角洲1:1消费，永不过期。</p>' +
                    '<p><strong>运费说明：</strong>回流的物流成本由买家本人承担。</p>' +
                    '<p><strong>成色评估：</strong>超过180天退回的商品，需经过我们的成色评估。无明显破损、可正常使用的，按上述比例返还；有明显损耗的，我们会单独报价（或建议您直接参与公益捐赠）。</p>' +
                    '<p><strong>Social Good：</strong>售价的 10% 固定进入公益金，每季度公示。10% goes to social good.</p>' +
                  '</div>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>';
      }

    function showDetail(index) {
        // Hide all sections except detail
        var allSections = document.querySelectorAll('section, footer');
        allSections.forEach(function(s) {
          s.style.display = 'none';
        });
        document.querySelector('header').style.display = 'none';

        // Show or create detail container
        var detail = document.getElementById('item-detail');
        if (!detail) {
          detail = document.createElement('div');
          detail.id = 'item-detail';
          detail.className = 'item-detail-page';
          document.body.appendChild(detail);
        }

        var item = getItemData(index);
        detail.style.display = 'block';
        detail.innerHTML = getDetailHTML(item, index);

        // Back button
        detail.querySelector('.detail-back').addEventListener('click', function() {
          hideDetail();
        });

        // Flowback toggle
        var flowbackToggle = detail.querySelector('.detail-flowback-toggle');
        var flowbackPanel = detail.querySelector('.detail-flowback');
        var flowbackArrow = detail.querySelector('.flowback-arrow');
        flowbackToggle.addEventListener('click', function() {
          if (flowbackPanel.style.display === 'none' || flowbackPanel.style.display === '') {
            flowbackPanel.style.display = 'block';
            flowbackArrow.textContent = '↑';
            flowbackToggle.classList.add('active');
            // Smooth scroll to panel
            setTimeout(function() {
              flowbackPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
          } else {
            flowbackPanel.style.display = 'none';
            flowbackArrow.textContent = '↓';
            flowbackToggle.classList.remove('active');
          }
        });

        // Scroll to top
        window.scrollTo(0, 0);

        // Reveal animation
        setTimeout(function() {
          detail.classList.add('visible');
        }, 50);
      }

    function hideDetail() {
        var detail = document.getElementById('item-detail');
        if (detail) {
          detail.classList.remove('visible');
          // Clear hash without triggering hashchange
          history.replaceState(null, '', window.location.pathname);
          setTimeout(function() {
            detail.style.display = 'none';
            var allSections = document.querySelectorAll('section, footer');
            allSections.forEach(function(s) {
              s.style.display = '';
            });
            document.querySelector('header').style.display = '';
            // Wait for layout to settle, then scroll to taste section
            requestAnimationFrame(function() {
              requestAnimationFrame(function() {
                window.scrollTo(0, 0);
              });
            });
            // Re-trigger reveal
            checkReveal();
          }, 300);
        }
      }

    // Click binding for archive items
    document.querySelectorAll('.masonry-item[data-index]').forEach(function(card) {
      card.addEventListener('click', function() {
        var idx = parseInt(this.getAttribute('data-index'));
        if (!isNaN(idx) && items[idx]) {
          showDetail(idx);
        }
      });
      card.style.cursor = 'pointer';
    });

  </script>
</body>
</html>
